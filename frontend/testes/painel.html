<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#EE4D2D">
  <meta name="robots" content="noindex, nofollow">
  <title>Painel · Bot de Ofertas</title>
  <link rel="stylesheet" href="../painel/css/painel.css">
  <script type="importmap">
    { "imports": { "supabase": "./supabase-falso.js" } }
  </script>
</head>
<body>
  <script>
    // "Publicar agora" simulado
    window.fetch = async (url) => new Response(JSON.stringify({ ok: true, mensagem: "Rodada disparada! (teste)" }), { status: 200 });
  </script>
  <header class="topo">
    <div class="marca">
      <img src="../painel/img/logo.png" alt="" width="40" height="40" class="logo">
      <div>
      <h1 id="titulo">Sonho das Promos</h1>
      <span id="papel" class="papel hide"></span>
      </div>
    </div>
    <div class="topo-acoes">
      <button id="btn-publicar" class="b claro hide" title="Rodar o bot agora">⚡ Publicar agora</button>
      <button id="btn-parar" class="b erro hide" title="Interromper todas as publicações reais">⛔ Parar tudo</button>
      <button id="btn-sair" class="b claro hide">Sair</button>
    </div>
  </header>
  <div id="faixa-parada" class="faixa-demo hide" role="alert" style="background:#b00020;color:#fff"></div>
  <div id="faixa-demo" class="faixa-demo hide" role="status"></div>

  <main id="conteudo" aria-live="polite">
    <p class="muted centro">Carregando…</p>
  </main>

  <nav id="nav" class="nav hide" aria-label="Seções">
    <button data-tela="resumo"><span>📊</span>Resumo</button>
    <button data-tela="ofertas"><span>🛍️</span>Ofertas</button>
    <button data-tela="nova" data-precisa="editar"><span>➕</span>Nova</button>
    <button data-tela="cupons"><span>🎟</span>Cupons</button>
    <button data-tela="comissoes"><span>💰</span>Comissões</button>
    <button data-tela="financeiro"><span>📊</span>Financeiro</button>
    <button data-tela="desempenho"><span>📈</span>Desempenho</button>
    <button data-tela="logs"><span>📜</span>Logs</button>
    <button data-tela="ajustes"><span>⚙️</span>Ajustes</button>
  </nav>
  <div id="toast" class="toast" role="alert"></div>

  <script type="module" src="../painel/js/app.js"></script>
</body>
</html>
