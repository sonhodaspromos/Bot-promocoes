name: Publicar painel

on:
  push:
    branches: [main]
    paths: ["frontend/**", ".github/workflows/painel.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  testar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "playwright>=1.47,<2" && python -m playwright install --with-deps chromium
      - run: python frontend/testes/testar_painel.py

  empacotar:
    needs: testar          # painel com teste falhando não é publicado
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: frontend/painel

  # A publicação fica num job separado: o artefato só aparece para o deploy-pages depois que o job
  # que o enviou termina (enviar e publicar no mesmo job falha com "No artifacts named github-pages").
  publicar:
    needs: empacotar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
