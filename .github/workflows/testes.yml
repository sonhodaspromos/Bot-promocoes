name: Testes

on:
  push:
    paths: ["backend/**", ".github/workflows/testes.yml"]
  pull_request:
    paths: ["backend/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Testes (sem internet, sem credenciais)
        run: python -m pytest -q
      - name: Simulação completa em modo demonstração
        run: python -m app.main simular
